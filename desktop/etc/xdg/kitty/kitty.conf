# Avalon: kitty in the Garden System colours. Your own ~/.config/kitty/kitty.conf wins.
font_family      DejaVu Sans Mono
font_size        11.5
window_padding_width 10
background_opacity 0.86
confirm_os_window_close 0
enable_audio_bell no
cursor_shape     block
cursor_blink_interval 0.6

# the Garden System: deep navy night, mist white text; the four elements in the colours
foreground           #e6eef7
background           #0a0f1c
selection_foreground #0a0f1c
selection_background #5fd8f0
cursor               #5fd8f0
cursor_text_color    #0a0f1c
url_color            #9aeaff
active_border_color  #5fd8f0
inactive_border_color #22304e

# black, fire, wind, earth, water, magenta, cyan, mist
color0  #0a0f1c
color8  #3a4a6a
color1  #e0705a
color9  #ff8a73
color2  #5bc85b
color10 #8fe38f
color3  #c9a35a
color11 #e6c47a
color4  #4a64c8
color12 #7a92ff
color5  #ff3fa4
color13 #ff7cc4
color6  #5fd8f0
color14 #9aeaff
color7  #c8c4d8
color15 #ffffff
