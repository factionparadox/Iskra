# /etc/greetd/config.toml: Avalon logs in with the Garden System's own login screen
# (Quickshell, in cage), which then starts your Mango session. Fedora's greetd runs its
# greeter as the user "greetd".
[terminal]
vt = 1

[default_session]
command = "cage -s -- quickshell -p /usr/share/garden/greeter.qml"
user = "greetd"
