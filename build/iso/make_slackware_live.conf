# liveslak settings for Iskra's stick. build/build-iso puts this beside liveslak's
# make_slackware_live.sh (which reads it first) and runs:
#   make_slackware_live.sh -d ISKRA -l gb -R 3 -H iskra -X -t doc -s /tmp/slackrepo
#
# The stick: Slackware -current's series a ap d l n x xap, then Iskra (the local module "iskra":
# Iskra's packages and the AlienBOB and conraid ones they need, downloaded and checked by sparkpkg).
# Live session: user live, password live (root's: root), logged in by ly to the Iskra session.
# iskra-install copies the system (everything but this live session's own module) to the disk.

LIVE_HOSTNAME="iskra"
MEDIALABEL="ISKRA"
LIVEUIDFN="Iskra Live"
SEQ_CUSTOM="tagfile:a,ap,d,l,n,x,xap local:iskra"

custom_config() {
  # Only the live session gets these (liveslak keeps them in module 0099, which iskra-install
  # leaves out): the installer, the automatic login, a note about installing.
  install -D -m0755 ${LIVE_TOOLDIR}/iskra-install ${LIVE_ROOTDIR}/usr/sbin/iskra-install

  # ly logs the live user straight in to the Iskra session
  local ly=${LIVE_ROOTDIR}/etc/ly/config.ini
  if [ -f "$ly" ]; then
    for kv in "auto_login_user=${LIVEUID}" "auto_login_session=iskra"; do
      k=${kv%%=*}; v=${kv#*=}
      if grep -q "^$k *=" "$ly"; then sed -i "s|^$k *=.*|$k = $v|" "$ly"; else echo "$k = $v" >> "$ly"; fi
    done
  fi

  # the live user's home from Iskra's skeleton (the ratpoison session, the bar, the keys)
  if [ -d ${LIVE_ROOTDIR}/usr/share/iskra/skel ]; then
    cp -a ${LIVE_ROOTDIR}/usr/share/iskra/skel/. ${LIVE_ROOTDIR}/home/${LIVEUID}/
    chroot ${LIVE_ROOTDIR} /bin/chown -R ${LIVEUID}:users /home/${LIVEUID}
  fi

  # how to install, on the console and in the live user's terminals
  cat >> ${LIVE_ROOTDIR}/etc/issue <<'EOT'

  Iskra live.  User: live  password: live.  To install Iskra on this laptop:  sudo iskra-install

EOT
  cat >> ${LIVE_ROOTDIR}/home/${LIVEUID}/.bashrc <<'EOT'
echo "This is Iskra's live stick. To install it on this laptop:  sudo iskra-install"
EOT
  chroot ${LIVE_ROOTDIR} /bin/chown ${LIVEUID}:users /home/${LIVEUID}/.bashrc
}
