# Iskra's package repository: build every package in packages/LIST in a Slackware -current system,
# sign them with Iskra's key, and publish them as the release "packages", where sparkpkg looks
# (https://github.com/factionparadox/iskra/releases/download/packages/).
#
# Packages already published at the same version are reused, not built again.
# Signing needs the secret ISKRA_SIGNING_KEY (build/make-signing-key sets it). Without it the
# packages are still built, and kept as this run's artifact, but nothing is published.
name: packages

on:
  push:
    branches: [main]
    paths: ['packages/**', 'desktop/**', 'learn/**', 'russian/**', 'branding/**', 'VERSION',
            'build/build-packages', 'build/make-repo', 'build/ci-root', 'build/slackware-root',
            '.github/workflows/packages.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'Build only these packages (names from packages/LIST, space-separated; empty: all)'
        required: false
        default: ''
  schedule:
    - cron: '17 3 * * 1'        # Mondays: rebuild against the week's -current

permissions:
  contents: write

concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Room to build (the runner's unused toolchains go)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h / /mnt

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg xz-utils zstd git

      - name: Slackware's packages, kept between runs
        uses: actions/cache/restore@v4
        with:
          path: /mnt/slackware-cache
          key: slackware-current-${{ github.run_id }}
          restore-keys: slackware-current-

      - name: A Slackware -current system to build in
        run: |
          sudo mkdir -p /mnt/slackware-cache && sudo chown -R "$USER" /mnt/slackware-cache
          sudo SLACK_CACHE=/mnt/slackware-cache build/slackware-root /mnt/root a ap d l n x xap
          sudo chown -R "$USER" /mnt/slackware-cache

      - name: Keep Slackware's packages for next time (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/slackware-cache
          key: slackware-current-${{ github.run_id }}

      - name: Ready it for building (slpkg, fakeroot, sparkpkg, the repositories' lists)
        run: sudo build/ci-root /mnt/root

      - name: What is published already (reused if unchanged)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          gh release download packages -D out --pattern '*.txz' --pattern 'requires.json' \
            --pattern 'ChangeLog.txt' --pattern 'PACKAGES.TXT' --pattern 'built.json' || echo "nothing published yet"
          ls out | wc -l

      - name: What earlier runs built but didn't publish (a run stopped part-way)
        uses: actions/cache/restore@v4
        with:
          path: out-cache
          key: iskra-built-${{ github.run_id }}
          restore-keys: iskra-built-

      - name: Build
        run: |
          # packages an earlier, unfinished run built: used when unchanged (build-packages checks)
          if [ -d out-cache ]; then
            for f in out-cache/*.txz; do [ -e "out/$(basename "$f")" ] || cp "$f" out/; done
            [ -f out/built.json ] || cp out-cache/built.json out/ 2>/dev/null || true
            python3 - <<'PY'
          import json, pathlib
          o, c = pathlib.Path('out'), pathlib.Path('out-cache')
          for f in ('built.json', 'requires.json'):
              if (c / f).is_file():
                  cur = json.loads((o / f).read_text()) if (o / f).is_file() else {}
                  old = json.loads((c / f).read_text())
                  (o / f).write_text(json.dumps({**cur, **old}, indent=2, sort_keys=True))   # the newer (unpublished) wins
          PY
          fi
          sudo build/build-packages /mnt/root out ${{ github.event.inputs.only }}

      - name: Keep what was built, even if the build stopped part-way
        if: always()
        run: |
          sudo rm -rf out-cache && mkdir out-cache
          sudo cp out/*.txz out/built.json out/requires.json out-cache/ 2>/dev/null || true
          sudo chown -R "$USER" out-cache

      - name: Save it for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out-cache
          key: iskra-built-${{ github.run_id }}

      - name: Make and sign the repository
        env:
          ISKRA_SIGNING_KEY: ${{ secrets.ISKRA_SIGNING_KEY }}
        run: |
          sudo chown -R "$USER" out
          # only what packages/LIST still names is published
          python3 build/make-repo out

      - name: Keep the packages (this run's artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iskra-packages
          path: out/
          retention-days: 14

      - name: Publish (release "packages")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/UNSIGNED ]; then
            echo "::error::No signing key (secret ISKRA_SIGNING_KEY), so nothing is published. Run build/make-signing-key once."
            exit 1
          fi
          gh release view packages >/dev/null 2>&1 ||
            gh release create packages --title "Iskra's packages" --latest=false \
              --notes "Iskra's package repository, for sparkpkg. Every package is signed; GPG-KEY is the key."
          gh release upload packages out/* --clobber
          # what packages/LIST no longer names goes from the release too
          keep=$(cd out && ls)
          gh release view packages --json assets --jq '.assets[].name' | while read -r a; do
            grep -qxF "$a" <<<"$keep" || gh release delete-asset packages "$a" --yes
          done

  # Iskra's install stick, made from the packages just published (build/build-iso, as on any
  # Linux: nothing compiled), and published as the release "iso".
  iso:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Room to build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h / /mnt

      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq curl gnupg xz-utils zstd git rsync

      - name: Slackware's packages (kept by the packages job)
        uses: actions/cache/restore@v4
        with:
          path: /mnt/slackware-cache
          key: slackware-current-${{ github.run_id }}
          restore-keys: slackware-current-

      - name: Iskra's public key, from the signing key (if it isn't pinned in the repository yet)
        env:
          ISKRA_SIGNING_KEY: ${{ secrets.ISKRA_SIGNING_KEY }}
        run: |
          keys=desktop/root/usr/share/sparkpkg/keys
          if ! grep -q '^iskra ' $keys/FINGERPRINTS; then
            g=$(mktemp -d); chmod 700 $g
            printf '%s\n' "$ISKRA_SIGNING_KEY" | gpg --homedir $g --batch --quiet --import
            fpr=$(gpg --homedir $g --batch --with-colons --list-secret-keys | awk -F: '/^fpr/ {print $10; exit}')
            gpg --homedir $g --batch --armor --export "$fpr" > $keys/iskra.asc
            echo "iskra    $fpr   Iskra packages (github.com/factionparadox/Iskra)" >> $keys/FINGERPRINTS
            rm -rf $g
            echo "Iskra's key: $fpr"
          fi

      - name: The stick
        run: |
          sudo mkdir -p /mnt/slackware-cache /mnt/iso
          sudo ISKRA_WORK=/mnt/iso SLACK_CACHE=/mnt/slackware-cache build/build-iso
          ls -la out/

      - name: Keep the stick (this run's artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iskra-iso
          path: out/iskra-*.iso*
          retention-days: 30
          compression-level: 0

      - name: Publish (release "iso"; in 1.9 GB pieces if it's bigger than GitHub's 2 GB per file)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          iso=$(ls iskra-*.iso | head -n 1)
          gh release view iso >/dev/null 2>&1 ||
            gh release create iso --title "Iskra's install stick" --latest \
              --notes "Iskra's live and install stick. Write it to a USB stick (Ventoy, Rufus or dd), Secure Boot off, start in UEFI mode. Live: user live, password live. Install: sudo iskra-install."
          for a in $(gh release view iso --json assets --jq '.assets[].name'); do gh release delete-asset iso "$a" --yes; done
          if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
            split -b 1900M -d -a 1 "$iso" "$iso.part"
            gh release upload iso "$iso".part* "$iso.sha256"
            gh release edit iso --notes "Iskra's live and install stick, in pieces (GitHub keeps files up to 2 GB). Download every piece and the .sha256, then join them: cat $iso.part* > $iso && sha256sum -c $iso.sha256. Write it to a USB stick (Ventoy, Rufus or dd), Secure Boot off, start in UEFI mode. Live: user live, password live. Install: sudo iskra-install."
          else
            gh release upload iso "$iso" "$iso.sha256"
          fi
